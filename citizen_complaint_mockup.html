<h2 class="sr-only">Mockup of the citizen complaint submission screen with text, image, and video input options and a tracking confirmation</h2>

<div style="max-width:360px; margin:0 auto; background:var(--surface-1); border-radius:12px; padding:1.25rem;">
  <div style="background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; padding:1rem 1.25rem;">
    <p style="font-weight:500; font-size:15px; margin:0 0 4px;">Report an issue</p>
    <p style="font-size:13px; color:var(--text-secondary); margin:0 0 12px;">Hyderabad only</p>

    <textarea rows="3" placeholder="Describe what's happening" style="width:100%; margin-bottom:12px;"></textarea>

    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <button style="flex:1;"><i class="ti ti-photo" style="font-size:16px; vertical-align:-2px; margin-right:4px;" aria-hidden="true"></i>Photo</button>
      <button style="flex:1;"><i class="ti ti-video" style="font-size:16px; vertical-align:-2px; margin-right:4px;" aria-hidden="true"></i>Video</button>
      <button style="flex:1;"><i class="ti ti-map-pin" style="font-size:16px; vertical-align:-2px; margin-right:4px;" aria-hidden="true"></i>Pin</button>
    </div>

    <div style="background:var(--surface-1); border-radius:var(--radius); padding:8px 10px; display:flex; align-items:center; gap:8px; margin-bottom:12px;">
      <i class="ti ti-map-pin" style="font-size:16px; color:var(--text-accent);" aria-hidden="true"></i>
      <span style="font-size:13px; color:var(--text-secondary);">Near Kothaguda junction, Kondapur</span>
    </div>

    <button style="width:100%; background:var(--fill-primary); color:var(--on-primary); border:none;">Submit report</button>
  </div>

  <div style="margin-top:12px; padding:10px 12px; background:var(--bg-success); border-radius:var(--radius); display:flex; align-items:center; gap:8px;">
    <i class="ti ti-check" style="font-size:16px; color:var(--text-success);" aria-hidden="true"></i>
    <span style="font-size:13px; color:var(--text-success);">Tracking ID #HYD-4821 · sent to your ward planner</span>
  </div>
</div>
