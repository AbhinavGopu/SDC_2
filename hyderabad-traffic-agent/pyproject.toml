[tool.poetry]
name = "hyderabad-traffic-agent"
version = "0.1.0"
description = "Hyderabad Traffic-Focused Agentic City Planner"
authors = ["Antigravity Developer <antigravity@google.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.100.0"
uvicorn = "^0.22.0"
pydantic = "^2.0"
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
pandas = "^2.0"
numpy = "^1.24"
networkx = "^3.1"
osmnx = "^1.6.0"
shapely = "^2.0"
geojson = "^3.0"
python-multipart = "^0.0.6"
pyyaml = "^6.0"
anthropic = "^0.3.0"
openai = "^1.0.0"
websockets = "^11.0"
PyJWT = "^2.9.0"
email-validator = "^2.3.0"
python-dotenv = "^1.2.2"
pgvector = "^0.5.0"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
